# Maximus production stack — only Caddy publishes 80/443
#
# Bundled data plane (default):
#   COMPOSE_PROFILES=bundled ./scripts/up-prod.sh
#
# External Postgres / Valkey / S3 (no local data services):
#   COMPOSE_PROFILES=   # empty
#   set DATABASE_URL, VALKEY_URL, S3_ENDPOINT, S3_* in .env.prod
#   ./scripts/up-prod.sh
#
#   docker compose -f docker/docker-compose.prod.yml --env-file .env.prod up -d --build

name: maximus

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# App env: prefer explicit URLs (external); fall back to in-compose service DNS when bundled.
x-app-env: &app-env
  NODE_ENV: production
  APP_URL: ${APP_URL:-https://${DOMAIN}}
  DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-maximus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-maximus}}
  VALKEY_URL: ${VALKEY_URL:-redis://:${VALKEY_PASSWORD}@valkey:6379}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
  PROVIDER_MODE: ${PROVIDER_MODE:-live}
  # true in real prod; set false for TLS_MODE=off local HTTP
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  RATE_LIMIT_FAIL_OPEN: ${RATE_LIMIT_FAIL_OPEN:-false}
  RATE_LIMIT_USER_PER_MIN: ${RATE_LIMIT_USER_PER_MIN:-60}
  RATE_LIMIT_ORG_PER_MIN: ${RATE_LIMIT_ORG_PER_MIN:-600}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
  ALLOW_PRIVATE_BASE_URLS: ${ALLOW_PRIVATE_BASE_URLS:-false}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-maximus}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET:-maximus-uploads}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  TRUST_PROXY: ${TRUST_PROXY:-true}
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}

services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2.9-alpine}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_UDP_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your hostname}
      ACME_EMAIL: ${ACME_EMAIL:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_HOSTED_ZONE_ID: ${AWS_HOSTED_ZONE_ID:-}
    volumes:
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # User-provided certs when TLS_MODE=custom (tls.crt + tls.key)
      - ${TLS_CERT_DIR:-./certs}:/certs:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - edge
      - internal

  migrate:
    image: ${IMAGE:-maximus-web:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      <<: *app-env
      RUN_MIGRATE: "1"
      MIGRATE_ONLY: "1"
    # postgres only when profile bundled (Compose v2.20+ required: false)
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: "no"
    networks:
      - internal

  web:
    # Prefer published GHCR tag, e.g. IMAGE=ghcr.io/billiondollarsolo/maximus:0.1.3
    # Without IMAGE, `docker compose up --build` builds maximus-web:local.
    image: ${IMAGE:-maximus-web:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      <<: *app-env
      RUN_MIGRATE: "0"
      MIGRATE_ONLY: "0"
      TRUST_PROXY: ${TRUST_PROXY:-true}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      valkey:
        condition: service_healthy
        required: false
      rustfs:
        condition: service_started
        required: false
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 50s
    logging: *default-logging
    networks:
      - internal

  # Optional first-owner bootstrap (empty DB only). Enable:
  #   COMPOSE_PROFILES=bundled,bootstrap   (or external + bootstrap)
  #   BOOTSTRAP_EMAIL / BOOTSTRAP_PASSWORD in .env.prod
  bootstrap:
    profiles: ["bootstrap"]
    image: curlimages/curl:8.11.1
    environment:
      # Public origin for CSRF (must match web APP_URL)
      APP_URL: ${APP_URL:-https://${DOMAIN}}
      # In-compose service — bootstrap script curls this; Origin stays APP_URL
      INTERNAL_URL: http://web:3000
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}
      BOOTSTRAP_NAME: ${BOOTSTRAP_NAME:-Owner}
      BOOTSTRAP_ORG_NAME: ${BOOTSTRAP_ORG_NAME:-Maximus}
      BOOTSTRAP_RETRIES: ${BOOTSTRAP_RETRIES:-40}
    volumes:
      - ../scripts/bootstrap-first-owner.sh:/bootstrap.sh:ro
    entrypoint: ["sh", "/bootstrap.sh"]
    depends_on:
      web:
        condition: service_healthy
    restart: "no"
    networks:
      - internal

  # --- Bundled data plane (profile: bundled) ---
  postgres:
    profiles: ["bundled"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maximus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD when using bundled profile}
      POSTGRES_DB: ${POSTGRES_DB:-maximus}
    volumes:
      - maximus_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal

  valkey:
    profiles: ["bundled"]
    image: valkey/valkey:8-alpine
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${VALKEY_PASSWORD:?Set VALKEY_PASSWORD when using bundled profile}
    volumes:
      - maximus_valkey:/data
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "valkey-cli -a \"$$VALKEY_PASSWORD\" ping 2>/dev/null | grep -q PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal

  rustfs:
    profiles: ["bundled"]
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-maximus}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    volumes:
      - maximus_rustfs:/data
    # No first-class health endpoint on all builds; app entrypoint retries bucket create.
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge

volumes:
  maximus_pg:
  maximus_valkey:
  maximus_rustfs:
  caddy_data:
  caddy_config:
