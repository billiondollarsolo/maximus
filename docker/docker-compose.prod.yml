# Maximus production stack — only Caddy publishes 80/443
#
#   cp .env.prod.example .env.prod && ./scripts/generate-secrets.sh --write .env.prod
#   # set DOMAIN, ACME_EMAIL, TLS_MODE (http01|cloudflare|route53|local)
#   ./scripts/up-prod.sh
#
# Or manually:
#   docker compose -f docker/docker-compose.prod.yml --env-file .env.prod up -d --build

name: maximus

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  caddy:
    # Stock image is enough for HTTP-01 and local TLS.
    # For Cloudflare/Route53 DNS-01, scripts/up-prod.sh builds Dockerfile.caddy
    # and sets CADDY_IMAGE=maximus-caddy:local
    image: ${CADDY_IMAGE:-caddy:2.9-alpine}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_UDP_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your hostname}
      ACME_EMAIL: ${ACME_EMAIL:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_HOSTED_ZONE_ID: ${AWS_HOSTED_ZONE_ID:-}
    volumes:
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - edge
      - internal

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment: &app-env
      NODE_ENV: production
      APP_URL: ${APP_URL:-https://${DOMAIN}}
      DATABASE_URL: postgres://${POSTGRES_USER:-maximus}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-maximus}
      VALKEY_URL: ${VALKEY_URL:-redis://:${VALKEY_PASSWORD}@valkey:6379}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      PROVIDER_MODE: ${PROVIDER_MODE:-live}
      COOKIE_SECURE: "true"
      RATE_LIMIT_FAIL_OPEN: ${RATE_LIMIT_FAIL_OPEN:-false}
      RATE_LIMIT_USER_PER_MIN: ${RATE_LIMIT_USER_PER_MIN:-60}
      RATE_LIMIT_ORG_PER_MIN: ${RATE_LIMIT_ORG_PER_MIN:-600}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      ALLOW_PRIVATE_BASE_URLS: ${ALLOW_PRIVATE_BASE_URLS:-false}
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-maximus}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-maximus-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: "true"
      RUN_MIGRATE: "1"
      MIGRATE_ONLY: "1"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - internal

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      <<: *app-env
      RUN_MIGRATE: "0"
      MIGRATE_ONLY: "0"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 50s
    logging: *default-logging
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maximus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-maximus}
    volumes:
      - maximus_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal
    # intentionally no ports: published — data plane stays private

  valkey:
    image: valkey/valkey:8-alpine
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${VALKEY_PASSWORD:?Set VALKEY_PASSWORD}
    volumes:
      - maximus_valkey:/data
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "valkey-cli -a \"$$VALKEY_PASSWORD\" ping 2>/dev/null | grep -q PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-maximus}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    volumes:
      - maximus_rustfs:/data
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge

volumes:
  maximus_pg:
  maximus_valkey:
  maximus_rustfs:
  caddy_data:
  caddy_config:
