# cert-manager ClusterIssuer — Let's Encrypt DNS-01 via AWS Route 53
# Automatic certificate rotation via cert-manager.
#
# Option A — static keys (dev only):
#   kubectl create secret generic route53-credentials \
#     -n cert-manager \
#     --from-literal=secret-access-key=...
#
# Option B — IRSA / instance role (recommended): grant the cert-manager
# ServiceAccount route53:ChangeResourceRecordSets on the hosted zone.
#
# Helm: cert-manager.io/cluster-issuer: letsencrypt-dns-route53
#
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns-route53
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@example.com   # CHANGE ME
    privateKeySecretRef:
      name: letsencrypt-dns-route53-account-key
    solvers:
      - dns01:
          route53:
            region: us-east-1
            # hostedZoneID: ZXXXXXXXX      # optional but recommended
            # accessKeyID: AKIA...         # optional if using IRSA
            # secretAccessKeySecretRef:
            #   name: route53-credentials
            #   key: secret-access-key
