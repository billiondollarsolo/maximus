# cert-manager ClusterIssuer — Let's Encrypt DNS-01 via Cloudflare
# Automatic certificate rotation (cert-manager renews + updates TLS Secret).
#
# 1. Create API token: Zone.DNS:Edit on the target zone
# 2. Store token:
#      kubectl create secret generic cloudflare-api-token \
#        -n cert-manager --from-literal=api-token=cf_...
# 3. kubectl apply -f this file (edit email / zone)
# 4. Helm: cert-manager.io/cluster-issuer: letsencrypt-dns-cloudflare
#
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns-cloudflare
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@example.com   # CHANGE ME
    privateKeySecretRef:
      name: letsencrypt-dns-cloudflare-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        # Optional: limit to one zone
        # selector:
        #   dnsZones:
        #     - example.com
