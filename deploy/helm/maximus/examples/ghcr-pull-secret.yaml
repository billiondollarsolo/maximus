# Optional: pull private ghcr.io/billiondollarsolo/maximus images.
#
# 1. Create a GitHub PAT with read:packages (and SSO authorized if org requires it)
# 2. Create the Secret:
#      kubectl create secret docker-registry ghcr-pull \
#        --docker-server=ghcr.io \
#        --docker-username=YOUR_GITHUB_USER \
#        --docker-password=YOUR_PAT \
#        --docker-email=you@example.com \
#        -n YOUR_NAMESPACE
#
# 3. Helm:
#      --set imagePullSecrets[0].name=ghcr-pull
#
# Prefer making the package public for open-source deploys (no pull secret):
#   GitHub → Packages → maximus → Package settings → Change visibility → Public
#   (requires admin on the org/repo that owns the package)
#
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull
  # namespace: maximus
type: kubernetes.io/dockerconfigjson
stringData:
  # Replace with output of:
  #   echo -n '{"auths":{"ghcr.io":{"auth":"'$(echo -n 'USER:PAT' | base64)'"}}}'
  .dockerconfigjson: |
    {"auths":{"ghcr.io":{"auth":"REPLACE_BASE64_USER_COLON_PAT"}}}
