# cert-manager ClusterIssuer — Let's Encrypt HTTP-01
# Prerequisites: cert-manager installed; Ingress controller handles :80 challenges
#
#   kubectl apply -f deploy/helm/maximus/examples/cert-manager-http01.yaml
#
# Then set on the Maximus release:
#   ingress.annotations.cert-manager.io/cluster-issuer: letsencrypt-prod
#   ingress.tls[0].secretName: maximus-tls
#
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@example.com   # CHANGE ME
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx     # CHANGE ME if needed
---
# Staging (rate-limit friendly)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ops@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
