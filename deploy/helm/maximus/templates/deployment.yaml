apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "maximus.fullname" . }}
  labels:
    {{- include "maximus.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "maximus.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "maximus.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "maximus.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: APP_URL
              value: {{ .Values.app.url | quote }}
            - name: COOKIE_SECURE
              value: {{ .Values.app.cookieSecure | quote }}
            - name: PROVIDER_MODE
              value: {{ .Values.app.providerMode | quote }}
            - name: ALLOW_PRIVATE_BASE_URLS
              value: {{ .Values.app.allowPrivateBaseUrls | quote }}
            - name: RATE_LIMIT_FAIL_OPEN
              value: {{ .Values.app.rateLimit.failOpen | quote }}
            - name: RATE_LIMIT_USER_PER_MIN
              value: {{ .Values.app.rateLimit.userPerMin | quote }}
            - name: RATE_LIMIT_ORG_PER_MIN
              value: {{ .Values.app.rateLimit.orgPerMin | quote }}
            - name: RUN_MIGRATE
              value: "0"
            - name: MIGRATE_ONLY
              value: "0"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "maximus.secretName" . }}
                  key: ENCRYPTION_KEY
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "maximus.secretName" . }}
                  key: BETTER_AUTH_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "maximus.secretName" . }}
                  key: DATABASE_URL
            - name: VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "maximus.secretName" . }}
                  key: VALKEY_URL
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ include "maximus.secretName" . }}
                  key: S3_ENDPOINT
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "maximus.secretName" . }}
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "maximus.secretName" . }}
                  key: S3_SECRET_KEY
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: {{ include "maximus.secretName" . }}
                  key: S3_BUCKET
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  name: {{ include "maximus.secretName" . }}
                  key: S3_REGION
            - name: S3_FORCE_PATH_STYLE
              valueFrom:
                secretKeyRef:
                  name: {{ include "maximus.secretName" . }}
                  key: S3_FORCE_PATH_STYLE
          envFrom:
            - secretRef:
                name: {{ include "maximus.secretName" . }}
                optional: false
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
