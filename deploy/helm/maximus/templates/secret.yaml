{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "maximus.fullname" . }}-secrets
  labels:
    {{- include "maximus.labels" . | nindent 4 }}
type: Opaque
stringData:
  ENCRYPTION_KEY: {{ required "secrets.encryptionKey (or secrets.existingSecret) is required" .Values.secrets.encryptionKey | quote }}
  BETTER_AUTH_SECRET: {{ default .Values.secrets.encryptionKey .Values.secrets.betterAuthSecret | quote }}
  DATABASE_URL: {{ required "database URL: enable postgresql or set externalDatabase.url" (include "maximus.databaseUrl" .) | quote }}
  VALKEY_URL: {{ required "redis URL: enable redis or set externalRedis.url" (include "maximus.valkeyUrl" .) | quote }}
  S3_ENDPOINT: {{ required "S3 endpoint: objectStorage.mode minio|external" (include "maximus.s3Endpoint" .) | quote }}
  {{- if eq .Values.objectStorage.mode "minio" }}
  S3_ACCESS_KEY: {{ .Values.objectStorage.minio.rootUser | quote }}
  S3_SECRET_KEY: {{ .Values.objectStorage.minio.rootPassword | quote }}
  S3_BUCKET: {{ .Values.objectStorage.minio.bucket | quote }}
  {{- else }}
  S3_ACCESS_KEY: {{ .Values.objectStorage.external.accessKey | quote }}
  S3_SECRET_KEY: {{ .Values.objectStorage.external.secretKey | quote }}
  S3_BUCKET: {{ .Values.objectStorage.external.bucket | quote }}
  {{- end }}
  S3_REGION: {{ default "us-east-1" .Values.objectStorage.external.region | quote }}
  S3_FORCE_PATH_STYLE: {{ if eq .Values.objectStorage.mode "minio" }}"true"{{ else }}{{ .Values.objectStorage.external.forcePathStyle | quote }}{{ end }}
  {{- if .Values.app.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.app.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.app.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.app.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.app.ollamaBaseUrl }}
  OLLAMA_BASE_URL: {{ .Values.app.ollamaBaseUrl | quote }}
  {{- end }}
{{- end }}
