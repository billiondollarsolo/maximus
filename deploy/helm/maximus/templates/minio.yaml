{{- if and (eq .Values.objectStorage.mode "minio") .Values.objectStorage.minio.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "maximus.fullname" . }}-minio
  labels:
    {{- include "maximus.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  ports:
    - port: 9000
      targetPort: s3
      name: s3
  selector:
    app.kubernetes.io/name: {{ include "maximus.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: minio
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "maximus.fullname" . }}-minio
  labels:
    {{- include "maximus.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  serviceName: {{ include "maximus.fullname" . }}-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "maximus.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "maximus.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: minio
    spec:
      containers:
        - name: minio
          image: {{ .Values.objectStorage.minio.image }}
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.objectStorage.minio.rootUser | quote }}
            - name: MINIO_ROOT_PASSWORD
              value: {{ .Values.objectStorage.minio.rootPassword | quote }}
          ports:
            - name: s3
              containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /data
  {{- if .Values.objectStorage.minio.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.objectStorage.minio.persistence.storageClass }}
        storageClassName: {{ .Values.objectStorage.minio.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.objectStorage.minio.persistence.size }}
  {{- else }}
      volumes:
        - name: data
          emptyDir: {}
  {{- end }}
{{- end }}
