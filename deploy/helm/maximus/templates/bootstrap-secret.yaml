{{- if and .Values.bootstrap.enabled (not .Values.bootstrap.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "maximus.fullname" . }}-bootstrap
  labels:
    {{- include "maximus.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  email: {{ required "bootstrap.email required when bootstrap.enabled" .Values.bootstrap.email | quote }}
  password: {{ required "bootstrap.password required when bootstrap.enabled" .Values.bootstrap.password | quote }}
{{- end }}
